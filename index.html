<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicking Game with Upgrades</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Clicking Game</h1>
    <p>Score: <span id="score">0</span></p>
    <p>Double Click Upgrade: <span id="upgradeStatus">Not Purchased</span></p>
    <button id="clickButton"></button>
    <button id="upgradeButton">Buy Double Click Upgrade (100 points)</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
